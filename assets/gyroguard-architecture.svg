<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-labelledby="title desc">
<title id="title">GyroGuard system architecture flowchart</title>
<desc id="desc">A visual architecture diagram showing IMU pitch estimation, encoder velocity control, ultrasonic obstacle sensing, battery interlocks, safety supervision, balance PID, TB6612 motor driver, and two drive wheels.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071523"/><stop offset="1" stop-color="#102b40"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3c5"/><stop offset="1" stop-color="#45a9ff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000814" flood-opacity=".35"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55d9d0"/></marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6bbcff"/></marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ffca70"/></marker>
  <style>
    .heading{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#f3f8fc;letter-spacing:1px}
    .sub{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#9bb7ca}
    .lane{font:700 14px Inter,Segoe UI,Arial,sans-serif;fill:#80a9bd;letter-spacing:2.5px}
    .nodeTitle{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#f1f8fc}
    .nodeSub{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#b1c7d6}
    .pill{font:700 12px Inter,Segoe UI,Arial,sans-serif;fill:#a8f5ed;letter-spacing:1px}
    .wire{fill:none;stroke:#55d9d0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .wireBlue{fill:none;stroke:#6bbcff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
    .wireAmber{fill:none;stroke:#ffca70;stroke-width:3;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowAmber)}
    .node{fill:#102b40;stroke:#2b536b;stroke-width:1.5}
    .nodeTeal{fill:#103747;stroke:#2ccfc3;stroke-width:1.8}
    .nodeBlue{fill:#142f49;stroke:#4d9bd4;stroke-width:1.8}
    .nodeAmber{fill:#3b3020;stroke:#e9b65f;stroke-width:1.8}
  </style>
</defs>
<rect width="1500" height="1040" rx="28" fill="url(#bg)"/>
<g opacity=".14" stroke="#6da5c0" stroke-width="1">
  <path d="M40 110H1460M40 400H1460M40 710H1460M40 960H1460"/>
  <path d="M40 40V1000M380 40V1000M750 40V1000M1120 40V1000M1460 40V1000"/>
</g>
<text x="70" y="75" class="heading">GYROGUARD · SYSTEM FLOW</text>
<text x="72" y="104" class="sub">Sensor inputs → estimation and decisions → motor actuation · ATmega328P</text>

<text x="75" y="155" class="lane">01 / SENSORS &amp; FEEDBACK</text>
<text x="480" y="155" class="lane">02 / CONTROL &amp; NAVIGATION</text>
<text x="1170" y="155" class="lane">03 / ACTUATION</text>

<!-- Connection paths are behind the nodes -->
<path class="wire" d="M360 250H455"/>
<path class="wire" d="M790 250H865"/>
<path class="wire" d="M1120 250H1170"/>
<path class="wireBlue" d="M360 465H455"/>
<path class="wireBlue" d="M790 465H825V330H985V300"/>
<path class="wire" d="M360 680H455"/>
<path class="wire" d="M790 680H865"/>
<path class="wire" d="M1120 680H1140V465H1170"/>
<path class="wireBlue" d="M360 875H455"/>
<path class="wireAmber" d="M790 875H825V735H865"/>
<path class="wire" d="M985 620V570H620V520"/>
<path class="wire" d="M1305 300V390"/>
<path class="wire" d="M1305 540V605"/>
<path class="wireAmber" d="M1120 875H1450V465H1440"/>
<path class="wireAmber" d="M985 790V815"/>

<!-- sensor nodes -->
<g filter="url(#shadow)">
  <rect class="node" x="75" y="195" width="285" height="110" rx="17"/>
  <rect x="75" y="195" width="7" height="110" rx="3" fill="#35d3c7"/>
  <text x="102" y="235" class="nodeTitle">MPU-6050 IMU</text>
  <text x="102" y="261" class="nodeSub">Accelerometer + gyroscope</text>
  <text x="102" y="285" class="pill">PITCH · ANGULAR RATE</text>

  <rect class="node" x="75" y="410" width="285" height="110" rx="17"/>
  <rect x="75" y="410" width="7" height="110" rx="3" fill="#68b9ff"/>
  <text x="102" y="450" class="nodeTitle">Wheel encoders</text>
  <text x="102" y="476" class="nodeSub">Left + right quadrature feedback</text>
  <text x="102" y="500" class="pill">WHEEL SPEED · DISTANCE</text>

  <rect class="node" x="75" y="625" width="285" height="110" rx="17"/>
  <rect x="75" y="625" width="7" height="110" rx="3" fill="#35d3c7"/>
  <text x="102" y="665" class="nodeTitle">HC-SR04 + SG90</text>
  <text x="102" y="691" class="nodeSub">Ultrasonic sensor scanning</text>
  <text x="102" y="715" class="pill">CENTER · LEFT · RIGHT</text>

  <rect class="node" x="75" y="820" width="285" height="110" rx="17"/>
  <rect x="75" y="820" width="7" height="110" rx="3" fill="#ffca70"/>
  <text x="102" y="860" class="nodeTitle">2S battery monitor</text>
  <text x="102" y="886" class="nodeSub">Divider measurement at A2</text>
  <text x="102" y="910" class="pill">VOLTAGE · VALIDITY</text>
</g>

<!-- control nodes -->
<g filter="url(#shadow)">
  <rect class="nodeTeal" x="455" y="195" width="335" height="110" rx="17"/>
  <text x="482" y="235" class="nodeTitle">Complementary filter</text>
  <text x="482" y="261" class="nodeSub">Fuse accelerometer + gyro data</text>
  <text x="482" y="285" class="pill">PITCH ESTIMATE</text>

  <rect class="nodeBlue" x="455" y="410" width="335" height="110" rx="17"/>
  <text x="482" y="450" class="nodeTitle">Velocity controller</text>
  <text x="482" y="476" class="nodeSub">Encoder feedback · 50 Hz</text>
  <text x="482" y="500" class="pill">SPEED → PITCH TARGET</text>

  <rect class="node" x="455" y="625" width="335" height="110" rx="17"/>
  <text x="482" y="665" class="nodeTitle">Range validation</text>
  <text x="482" y="691" class="nodeSub">Reject invalid or stale echoes</text>
  <text x="482" y="715" class="pill">FRESH · VALID · CLEAR</text>

  <rect class="nodeAmber" x="455" y="820" width="335" height="110" rx="17"/>
  <text x="482" y="860" class="nodeTitle">Travel interlock</text>
  <text x="482" y="886" class="nodeSub">Low / invalid voltage blocks autonomy</text>
  <text x="482" y="910" class="pill">6.8 V STOP · 7.0 V RECOVERY</text>

  <rect class="nodeTeal" x="865" y="195" width="255" height="110" rx="17"/>
  <text x="892" y="235" class="nodeTitle">Balance PID</text>
  <text x="892" y="261" class="nodeSub">Pitch + gyro-rate feedback</text>
  <text x="892" y="285" class="pill">200 Hz · INNER LOOP</text>

  <rect class="node" x="865" y="625" width="255" height="165" rx="17"/>
  <text x="892" y="665" class="nodeTitle">Obstacle planner</text>
  <text x="892" y="693" class="nodeSub">Compare left / right clearance</text>
  <text x="892" y="718" class="nodeSub">Choose speed or turn request</text>
  <rect x="892" y="744" width="160" height="27" rx="13" fill="#153e4c"/>
  <text x="972" y="762" class="pill" text-anchor="middle">NO REAR SENSOR</text>

  <rect class="nodeAmber" x="865" y="820" width="255" height="110" rx="17"/>
  <text x="892" y="860" class="nodeTitle">Safety supervisor</text>
  <text x="892" y="886" class="nodeSub">Tilt · IMU · loop timing · faults</text>
  <text x="892" y="910" class="pill">FAULT → MOTOR DISABLE</text>
</g>

<!-- actuation -->
<g filter="url(#shadow)">
  <rect class="nodeBlue" x="1170" y="195" width="270" height="105" rx="17"/>
  <text x="1197" y="237" class="nodeTitle">TB6612FNG</text>
  <text x="1197" y="264" class="nodeSub">Dual H-bridge motor driver</text>
  <text x="1197" y="286" class="pill">PWM + DIRECTION</text>

  <rect class="nodeTeal" x="1170" y="390" width="270" height="150" rx="17"/>
  <text x="1197" y="430" class="nodeTitle">Two drive wheels</text>
  <text x="1197" y="458" class="nodeSub">Left motor + right motor</text>
  <g transform="translate(1210 480)">
    <circle cx="20" cy="20" r="17" fill="#071523" stroke="#42d8cf" stroke-width="4"/>
    <circle cx="20" cy="20" r="5" fill="#42d8cf"/>
    <circle cx="190" cy="20" r="17" fill="#071523" stroke="#42d8cf" stroke-width="4"/>
    <circle cx="190" cy="20" r="5" fill="#42d8cf"/>
    <path d="M48 20H162" stroke="#82c8db" stroke-width="5" stroke-linecap="round"/>
  </g>

  <rect class="nodeAmber" x="1170" y="820" width="270" height="110" rx="17"/>
  <text x="1197" y="860" class="nodeTitle">Motor inhibit</text>
  <text x="1197" y="886" class="nodeSub">Driver disabled on latched fault</text>
  <text x="1197" y="910" class="pill">SAFE STATE</text>
</g>

<!-- annotations -->
<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">
  <rect x="805" y="225" width="50" height="25" rx="12" fill="#143a4b"/><text x="830" y="242" text-anchor="middle" fill="#a9f1e8">PITCH</text>
  <rect x="800" y="440" width="55" height="25" rx="12" fill="#172f49"/><text x="827" y="457" text-anchor="middle" fill="#b6dcff">SPEED</text>
  <rect x="800" y="650" width="55" height="25" rx="12" fill="#143a4b"/><text x="827" y="667" text-anchor="middle" fill="#a9f1e8">RANGE</text>
</g>

<path d="M75 975H1440" stroke="#52788d" stroke-opacity=".55"/>
<circle cx="90" cy="1005" r="5" fill="#55d9d0"/><text x="106" y="1010" class="sub">Main control and data flow</text>
<circle cx="390" cy="1005" r="5" fill="#6bbcff"/><text x="406" y="1010" class="sub">Encoder feedback / speed request</text>
<circle cx="800" cy="1005" r="5" fill="#ffca70"/><text x="816" y="1010" class="sub">Safety interlock / inhibit</text>
<text x="1440" y="1010" text-anchor="end" class="sub">GyroGuard · Architecture</text>
</svg>