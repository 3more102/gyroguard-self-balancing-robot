<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">GyroGuard — Two-wheel self-balancing robot</title>
  <desc id="desc">A technical illustration of a two-wheel balancing robot with an ultrasonic scanner, balance axis, and obstacle radar on a dark engineering-themed background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071525"/>
      <stop offset="0.58" stop-color="#102d43"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f6ff"/>
      <stop offset="1" stop-color="#79b7d6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39e0d0"/>
      <stop offset="1" stop-color="#3aa8ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7bb4d0" stroke-opacity=".10" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.4" fill="#7bb4d0" fill-opacity=".20"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
