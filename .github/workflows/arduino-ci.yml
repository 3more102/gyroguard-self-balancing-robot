name: Arduino build

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

jobs:
  compile-uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Compile for Arduino Uno
        run: arduino-cli compile --fqbn arduino:avr:uno firmware/GyroGuard
