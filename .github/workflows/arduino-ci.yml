name: Arduino build

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

jobs:
  host-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test PID controller
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/test_pid.cpp firmware/GyroGuard/pid.cpp -o /tmp/gyroguard-pid-test
          /tmp/gyroguard-pid-test
      - name: Test encoder velocity conversion
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -pedantic tests/test_encoder_math.cpp -o /tmp/gyroguard-encoder-math-test
          /tmp/gyroguard-encoder-math-test

  compile-arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned AVR core and Servo dependency
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib update-index
          arduino-cli lib install Servo@1.3.0
          arduino-cli lib list Servo
      - name: Compile for Arduino Uno R3
        run: arduino-cli compile --warnings all --fqbn arduino:avr:uno firmware/GyroGuard
      - name: Compile for classic Arduino Nano
        run: arduino-cli compile --warnings all --fqbn arduino:avr:nano firmware/GyroGuard
