name: Arduino build

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

jobs:
  host-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test PID controller
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_pid.cpp firmware/GyroGuard/pid.cpp -o /tmp/gyroguard-pid-test
          /tmp/gyroguard-pid-test
      - name: Test stationary calibration statistics
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_calibration_stats.cpp -o /tmp/gyroguard-calibration-test
          /tmp/gyroguard-calibration-test

  compile-uno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install Servo
      - name: Compile for Arduino Uno
        run: arduino-cli compile --fqbn arduino:avr:uno firmware/GyroGuard
