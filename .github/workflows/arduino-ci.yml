name: Arduino build

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

jobs:
  host-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test PID controller
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_pid.cpp firmware/GyroGuard/pid.cpp -o /tmp/gyroguard-pid-test
          /tmp/gyroguard-pid-test
      - name: Test obstacle navigation policy
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_navigation_policy.cpp -o /tmp/gyroguard-navigation-test
          /tmp/gyroguard-navigation-test

  compile-avr:
    name: Compile ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: Arduino Uno
            fqbn: arduino:avr:uno
          - board: Arduino Nano (new bootloader)
            fqbn: arduino:avr:nano:cpu=atmega328
          - board: Arduino Nano (old bootloader)
            fqbn: arduino:avr:nano:cpu=atmega328old
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core and Servo library
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install Servo
      - name: Compile for ${{ matrix.board }}
        run: arduino-cli compile --fqbn "${{ matrix.fqbn }}" firmware/GyroGuard
