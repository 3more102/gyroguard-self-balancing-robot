name: Arduino build

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

jobs:
  host-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test PID controller
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_pid.cpp firmware/GyroGuard/pid.cpp -o /tmp/gyroguard-pid-test
          /tmp/gyroguard-pid-test
      - name: Test obstacle navigation policy
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_navigation_policy.cpp -o /tmp/gyroguard-navigation-test
          /tmp/gyroguard-navigation-test
      - name: Test front-range freshness guard
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_range_guard.cpp -o /tmp/gyroguard-range-guard-test
          /tmp/gyroguard-range-guard-test
      - name: Test obstacle-avoidance state machine
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I tests/fakes tests/test_navigation_state_machine.cpp firmware/GyroGuard/obstacle_avoidance.cpp -o /tmp/gyroguard-navigation-state-machine-test
          /tmp/gyroguard-navigation-state-machine-test
      - name: Test servo-center settle and re-arm behavior
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I tests/fakes tests/test_servo_center_settle.cpp firmware/GyroGuard/obstacle_avoidance.cpp -o /tmp/gyroguard-servo-settle-test
          /tmp/gyroguard-servo-settle-test
      - name: Test IMU identity and calibration validation
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_imu_validation.cpp -o /tmp/gyroguard-imu-validation-test
          /tmp/gyroguard-imu-validation-test
      - name: Test balance arming interlock
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_balance_arming.cpp -o /tmp/gyroguard-arm-test
          /tmp/gyroguard-arm-test
      - name: Test encoder motion watchdog
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_motion_guard.cpp -o /tmp/gyroguard-motion-guard-test
          /tmp/gyroguard-motion-guard-test
      - name: Test battery voltage policy
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/test_battery_policy.cpp -o /tmp/gyroguard-battery-policy-test
          /tmp/gyroguard-battery-policy-test

  model-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y octave
      - name: Run Stage 2 model checks
        run: octave --no-gui --quiet --eval "addpath('matlab'); gyroguard_stage2_analysis(false);"

  compile-avr-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core and dependencies
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install Servo
      - name: Compile Uno and classic Nano with memory budgets
        shell: bash
        run: |
          set -euo pipefail

          check_build() {
            local fqbn="$1"
            local output
            local flash_bytes
            local sram_bytes

            if ! output="$(arduino-cli compile --fqbn "$fqbn" firmware/GyroGuard 2>&1)"; then
              printf '%s\n' "$output"
              return 1
            fi

            printf '%s\n' "$output"
            flash_bytes="$(sed -nE 's/^Sketch uses ([0-9]+) bytes.*/\1/p' <<<"$output" | tail -n 1)"
            sram_bytes="$(sed -nE 's/^Global variables use ([0-9]+) bytes.*/\1/p' <<<"$output" | tail -n 1)"

            if [[ -z "$flash_bytes" || -z "$sram_bytes" ]]; then
              echo "Could not parse the Arduino memory report for $fqbn."
              return 1
            fi

            if (( flash_bytes > 24000 )); then
              echo "Flash budget exceeded for $fqbn: $flash_bytes > 24000 bytes."
              return 1
            fi

            if (( sram_bytes > 1200 )); then
              echo "Static SRAM budget exceeded for $fqbn: $sram_bytes > 1200 bytes."
              return 1
            fi

            echo "Resource budget passed for $fqbn: flash=$flash_bytes bytes, static_sram=$sram_bytes bytes."
          }

          check_build arduino:avr:uno
          check_build arduino:avr:nano
